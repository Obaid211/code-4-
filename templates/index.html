<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartAgri AI — Intelligent Agriculture</title>
    <meta name="description" content="SmartAgri AI - Empowering farmers with AI-driven crop recommendations, plant health analysis, weather forecasts, and farming guidance.">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Existing CSS -->
    <link rel="stylesheet" href="/static/css/styles.css">
    <link rel="stylesheet" href="/static/css/chat.css">
    <link rel="stylesheet" href="/static/css/analyzer.css">

    <!-- Recommender page inline styles (from dashboard.html) -->
    <style>
        :root {
            --color-navy-bg: #0A192F;
            --color-green-accent: #28a745;
            --color-green-glow: rgba(40, 167, 69, 0.5);
            --color-blue-accent: #00A7E1;
            --color-blue-glow: rgba(0, 167, 225, 0.3);
            --color-glass-bg: rgba(255, 255, 255, 0.05);
            --color-glass-border: rgba(255, 255, 255, 0.15);
            --color-text-primary: #f0f0f0;
            --color-text-secondary: #b0b0b0;
            --border-radius: 14px;
            --font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        .recommender-container {
            max-width: 1400px;
            margin: 2rem auto;
            padding: 0 2rem;
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 2.5rem;
        }

        .glass-card {
            background: var(--color-glass-bg);
            border-radius: var(--border-radius);
            border: 1px solid var(--color-glass-border);
            padding: 2rem 2.5rem;
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
        }

        .recommender-section {
            position: sticky;
            top: 100px;
            align-self: start;
        }

        .recommender-section h2 {
            text-align: center;
            color: var(--color-text-primary);
            margin-top: 0;
            font-size: 1.75rem;
            font-weight: 700;
        }

        .recommender-section > p {
            text-align: center;
            color: var(--color-text-secondary);
            margin-bottom: 2rem;
            font-size: 1rem;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 1.25rem;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group label {
            margin-bottom: 0.5rem;
            font-weight: 600;
            color: var(--color-text-primary);
            font-size: 0.9rem;
        }

        .form-group input {
            padding: 0.9rem;
            border: 1px solid var(--color-glass-border);
            border-radius: 8px;
            font-size: 1rem;
            font-family: var(--font-family);
            background: rgba(0, 0, 0, 0.2);
            color: var(--color-text-primary);
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .form-group input::placeholder {
            color: var(--color-text-secondary);
            opacity: 0.7;
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--color-green-accent);
            box-shadow: 0 0 0 3px rgba(40, 167, 69, 0.3);
        }

        .action-button {
            width: 100%;
            padding: 1rem;
            font-size: 1.1rem;
            font-weight: 600;
            color: #fff;
            background-color: var(--color-green-accent);
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 1rem;
            box-shadow: 0 0 20px var(--color-green-glow);
        }

        .action-button:hover {
            background-color: #2eaf47;
            transform: translateY(-2px);
            box-shadow: 0 0 30px 5px var(--color-green-glow);
        }

        .action-button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .results-area {
            display: flex;
            flex-direction: column;
            gap: 2rem;
        }

        .results-card {
            transition: box-shadow 0.3s ease, transform 0.3s ease;
        }

        .irrigation-card {
            background: rgba(0, 167, 225, 0.1);
            border-color: rgba(0, 167, 225, 0.2);
            box-shadow: 0 0 30px var(--color-blue-glow);
        }

        .irrigation-card h3 {
            color: var(--color-blue-accent);
            border-color: rgba(0, 167, 225, 0.2);
        }

        .irrigation-action {
            font-size: 2.25rem;
            font-weight: 700;
            color: var(--color-blue-accent);
            margin: 1.5rem 0 1rem 0;
            text-align: center;
        }

        .irrigation-priority {
            text-align: center;
            font-size: 1rem;
            font-weight: 600;
            color: var(--color-text-secondary);
        }

        .irrigation-priority span {
            padding: 0.4rem 1rem;
            border-radius: 20px;
            background-color: var(--color-blue-accent);
            color: #fff;
            margin-left: 10px;
            display: inline-block;
            font-weight: 700;
            font-size: 1.1rem;
        }

        .irrigation-explanation {
            font-size: 1rem;
            color: var(--color-text-primary);
            line-height: 1.6;
            text-align: center;
            margin-top: 1.5rem;
            background-color: rgba(0, 167, 225, 0.1);
            padding: 1rem;
            border-radius: 8px;
        }

        .crop-list {
            list-style: none;
            padding: 0;
            margin: 0;
            display: grid;
            grid-template-columns: 1fr;
            gap: 1.5rem;
        }

        .crop-item {
            border: 1px solid var(--color-glass-border);
            border-radius: var(--border-radius);
            padding: 1.5rem 2rem;
            background: var(--color-glass-bg);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
            transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.3s ease;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.5rem;
            align-items: center;
            position: relative;
        }

        .crop-item:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
            background: rgba(255, 255, 255, 0.08);
        }

        .crop-name {
            font-size: 1.75rem;
            font-weight: 700;
            color: var(--color-text-primary);
            margin: 0 0 0.5rem 0;
        }

        .crop-confidence {
            font-size: 1.1rem;
            color: var(--color-text-secondary);
            margin-bottom: 0;
            font-weight: 600;
        }

        .crop-confidence strong {
            color: var(--color-text-primary);
            font-size: 1.25rem;
        }

        .crop-fertilizer {
            font-size: 0.95rem;
            color: var(--color-text-primary);
            line-height: 1.5;
            background: rgba(0, 0, 0, 0.2);
            padding: 1rem;
            border-radius: 8px;
        }

        .crop-item.top-pick {
            background: rgba(40, 167, 69, 0.15);
            border-color: rgba(40, 167, 69, 0.4);
            grid-template-columns: 1fr;
            text-align: center;
            box-shadow: 0 0 40px var(--color-green-glow);
        }

        .crop-item.top-pick .crop-name {
            font-size: 2.5rem;
            color: var(--color-green-accent);
        }

        .crop-item.top-pick .crop-confidence {
            font-size: 1.25rem;
            margin-bottom: 1rem;
        }

        .crop-item.top-pick .crop-confidence strong {
            font-size: 1.5rem;
        }

        .crop-item.top-pick .crop-fertilizer {
            background-color: rgba(40, 167, 69, 0.1);
            width: 80%;
            margin: 0 auto;
        }

        .top-pick-badge {
            position: absolute;
            top: -1px;
            right: 20px;
            background: var(--color-green-accent);
            color: #fff;
            padding: 0.3rem 1rem;
            font-size: 0.9rem;
            font-weight: 600;
            border-radius: 0 0 8px 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.2);
        }

        .error-message {
            background-color: rgba(200, 50, 50, 0.2);
            border: 1px solid rgba(200, 50, 50, 0.5);
            color: #ffcdd2;
            padding: 1.5rem;
            border-radius: var(--border-radius);
            text-align: center;
            font-size: 1.1rem;
            font-weight: 600;
        }

        /* Login page styles */
        .login-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            position: relative;
            overflow: hidden;
        }
        .login-container::before {
            content: '';
            position: absolute;
            top: -50%; left: -50%;
            width: 200%; height: 200%;
            background: radial-gradient(circle, rgba(45, 159, 96, 0.1) 0%, transparent 70%);
            animation: pulse 15s ease-in-out infinite;
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1) rotate(0deg); }
            50% { transform: scale(1.1) rotate(180deg); }
        }
        .login-wrapper {
            display: grid;
            grid-template-columns: 1fr 1fr;
            max-width: 1100px;
            width: 100%;
            background: var(--glass, rgba(255,255,255,0.05));
            border: 1px solid var(--glass-border, rgba(255,255,255,0.15));
            border-radius: 24px;
            overflow: hidden;
            backdrop-filter: blur(20px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            position: relative;
            z-index: 1;
        }
        .login-hero {
            background: linear-gradient(135deg, rgba(45, 159, 96, 0.25) 0%, rgba(34, 163, 68, 0.15) 100%);
            padding: 4rem 3rem;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }
        .hero-icon {
            font-size: 6rem;
            margin-bottom: 1.5rem;
            animation: float 3s ease-in-out infinite;
        }
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-20px); }
        }
        .login-hero h1 { font-size: 2.8rem; color: var(--accent, #2d9f60); margin-bottom: 1rem; font-weight: 700; }
        .login-hero p { color: var(--muted, #b0b0b0); font-size: 1.15rem; line-height: 1.7; }
        .login-form-section { padding: 4rem 3rem; display: flex; flex-direction: column; justify-content: center; }
        .login-form-section h2 { color: var(--accent, #2d9f60); margin-bottom: 0.5rem; font-size: 2.2rem; font-weight: 700; }
        .login-form-section .subtitle { color: var(--muted, #b0b0b0); margin-bottom: 2.5rem; font-size: 1rem; }
        .login-form { display: flex; flex-direction: column; gap: 1.5rem; }
        .input-wrapper { position: relative; }
        .input-icon { position: absolute; left: 1rem; top: 50%; transform: translateY(-50%); color: var(--muted, #b0b0b0); font-size: 1.1rem; }
        .login-form .form-group input {
            border: 1px solid var(--glass-border, rgba(255,255,255,0.15));
            border-radius: 10px;
            padding: 1rem 1rem 1rem 3rem;
            font-size: 1rem;
            background: var(--glass-2, rgba(255,255,255,0.08));
            color: var(--muted, #b0b0b0);
            transition: all 0.3s ease;
            width: 100%;
        }
        .login-form .form-group input:focus {
            outline: none;
            border-color: var(--accent, #2d9f60);
            background: rgba(255, 255, 255, 0.12);
            box-shadow: 0 0 0 3px rgba(45, 159, 96, 0.1);
        }
        .password-toggle {
            position: absolute; right: 1rem; top: 50%; transform: translateY(-50%);
            background: none; border: none; color: var(--muted, #b0b0b0); cursor: pointer; font-size: 1.1rem;
        }
        .form-options { display: flex; justify-content: space-between; align-items: center; margin-top: -0.5rem; }
        .remember-me { display: flex; align-items: center; gap: 0.5rem; cursor: pointer; }
        .remember-me input[type="checkbox"] { width: 18px; height: 18px; cursor: pointer; accent-color: var(--accent, #2d9f60); }
        .remember-me label { color: var(--muted, #b0b0b0); font-size: 0.9rem; cursor: pointer; }
        .forgot-password { color: var(--accent, #2d9f60); text-decoration: none; font-size: 0.9rem; font-weight: 600; }
        .login-button {
            background: linear-gradient(135deg, var(--accent, #2d9f60) 0%, #22a344 100%);
            color: white; border: none; border-radius: 10px; padding: 1.1rem;
            font-size: 1.05rem; font-weight: 700; cursor: pointer; transition: all 0.3s ease; margin-top: 0.5rem;
        }
        .login-button:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(45, 159, 96, 0.4); }
        .login-button:disabled { opacity: 0.6; cursor: not-allowed; }
        .divider { display: flex; align-items: center; gap: 1rem; margin: 1.75rem 0; }
        .divider-line { flex: 1; height: 1px; background: var(--glass-border, rgba(255,255,255,0.15)); }
        .divider-text { color: var(--muted, #b0b0b0); font-size: 0.9rem; }
        .signup-link { text-align: center; margin-top: 2rem; color: var(--muted, #b0b0b0); font-size: 0.95rem; }
        .signup-link a { color: var(--accent, #2d9f60); text-decoration: none; font-weight: 700; }
        .form-status {
            padding: 1rem; border-radius: 10px; text-align: center; font-weight: 600; margin-bottom: 1rem;
        }
        .form-status.success { background: rgba(76, 175, 80, 0.2); color: #4caf50; border: 1px solid #4caf50; }
        .form-status.error { background: rgba(244, 67, 54, 0.2); color: #f44336; border: 1px solid #f44336; }

        /* FAQ buttons */
        .faq-container {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            padding: 0 0 0.5rem 0;
        }

        /* Responsive */
        @media (max-width: 968px) {
            .login-wrapper { grid-template-columns: 1fr; max-width: 500px; }
            .login-hero { padding: 3rem 2rem; }
            .login-hero h1 { font-size: 2.2rem; }
            .hero-icon { font-size: 4.5rem; }
            .login-form-section { padding: 3rem 2rem; }
        }
        @media (max-width: 900px) {
            .recommender-container { grid-template-columns: 1fr; }
            .recommender-section { position: static; }
            .crop-item, .crop-item.top-pick { grid-template-columns: 1fr; text-align: center; }
            .crop-item.top-pick .crop-fertilizer { width: 100%; }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <!-- Firebase CDN -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

    <!-- React CDN -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

    <!-- Babel Standalone for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Services (plain JS, no JSX) -->
    <script src="/static/react/services/firebase.js"></script>
    <script src="/static/react/services/api.js"></script>

    <!-- React Components (JSX, transpiled by Babel) -->
    <script type="text/babel" src="/static/react/components/Navbar.js"></script>
    <script type="text/babel" src="/static/react/components/Footer.js"></script>
    <script type="text/babel" src="/static/react/pages/DashboardPage.js"></script>
    <script type="text/babel" src="/static/react/pages/ChatPage.js"></script>
    <script type="text/babel" src="/static/react/pages/AnalyzerPage.js"></script>
    <script type="text/babel" src="/static/react/pages/RecommenderPage.js"></script>
    <script type="text/babel" src="/static/react/pages/MarketPage.js"></script>
    <script type="text/babel" src="/static/react/pages/AboutPage.js"></script>
    <script type="text/babel" src="/static/react/pages/ContactPage.js"></script>
    <script type="text/babel" src="/static/react/pages/LoginPage.js"></script>
    <script type="text/babel" src="/static/react/pages/SignupPage.js"></script>
    <script type="text/babel" src="/static/react/pages/ProfilePage.js"></script>
    <script type="text/babel" src="/static/react/App.js"></script>

    <!-- Mount React App -->
    <script type="text/babel">
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
